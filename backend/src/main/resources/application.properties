# Application
spring.application.name=avcoe-lost-found
server.port=8080

# Database - H2 for development
spring.datasource.url=jdbc:h2:mem:avcoe_lostfound
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# File Upload
upload.dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# JWT
jwt.secret=AVCOE-LostFound-Secret-Key-That-Is-Long-Enough-For-HS512-Algorithm-2024
jwt.expiration=86400000

# Logging
logging.level.com.avcoe.lostfound=DEBUG
