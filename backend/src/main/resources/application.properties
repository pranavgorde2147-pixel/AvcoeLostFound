# Application
spring.application.name=avcoe-lost-found
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}
server.forward-headers-strategy=framework

# Database - H2 for development, PostgreSQL via environment variables when provided
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:avcoe_lostfound}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# File Upload
upload.dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# JWT
jwt.secret=${JWT_SECRET:local-development-only-secret-do-not-use-in-production}
jwt.expiration=86400000

# Logging
app.seed-demo-data=${APP_SEED_DEMO_DATA:true}
app.initial-admin-email=${APP_INITIAL_ADMIN_EMAIL:}
app.initial-admin-password=${APP_INITIAL_ADMIN_PASSWORD:}
app.initial-admin-name=${APP_INITIAL_ADMIN_NAME:AVCOE Administrator}
logging.level.com.avcoe.lostfound=${LOGGING_LEVEL_COM_AVCOE_LOSTFOUND:INFO}
