# Application
spring.application.name=avcoe-lost-found
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}
server.forward-headers-strategy=framework

# Database - H2 for development, PostgreSQL via environment variables when provided
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:avcoe_lostfound}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# File Upload
upload.dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# JWT
jwt.secret=AVCOE-LostFound-Secret-Key-That-Is-Long-Enough-For-HS512-Algorithm-2024
jwt.expiration=86400000

# Logging
logging.level.com.avcoe.lostfound=DEBUG
