<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages — AVCOE Lost & Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animations.css">
    <style>
        .chat-layout { display: flex; height: calc(100vh - var(--header-height)); overflow: hidden; }
        .chat-sidebar {
            width: 320px;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            flex-shrink: 0;
        }
        .chat-sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .chat-sidebar-header h3 { font-size: 1rem; font-weight: 600; }
        .chat-search {
            width: 100%;
            padding: 8px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 0.85rem;
            outline: none;
            margin-top: 12px;
            transition: border-color var(--transition-fast);
        }
        .chat-search:focus { border-color: var(--accent-primary); }
        .chat-list { flex: 1; overflow-y: auto; }
        .chat-list-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            cursor: pointer;
            transition: background var(--transition-fast);
            border-bottom: 1px solid rgba(255,255,255,0.03);
            position: relative;
        }
        .chat-list-item:hover { background: rgba(255,255,255,0.03); }
        .chat-list-item.active { background: rgba(99, 102, 241, 0.1); border-left: 3px solid var(--accent-primary); }
        .chat-list-info { flex: 1; min-width: 0; }
        .chat-list-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
        .chat-list-name { font-size: 0.9rem; font-weight: 500; }
        .chat-list-time { font-size: 0.7rem; color: var(--text-muted); flex-shrink: 0; }
        .chat-list-item-name { font-size: 0.75rem; color: var(--accent-primary); margin-bottom: 2px; }
        .chat-list-preview {
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-list-item .unread-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-primary);
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
        }

        .chat-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .chat-header {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-secondary);
            flex-shrink: 0;
        }
        .chat-back-btn {
            display: none;
            width: 36px;
            height: 36px;
            border-radius: var(--radius-md);
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            flex-shrink: 0;
        }
        .chat-header-info { flex: 1; min-width: 0; }
        .chat-header-name { font-size: 1rem; font-weight: 600; }
        .chat-header-item { font-size: 0.75rem; color: var(--text-muted); }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        .chat-messages::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }

        .message {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: var(--radius-lg);
            font-size: 0.9rem;
            line-height: 1.5;
            animation: fadeInUp 0.2s ease;
            position: relative;
            word-wrap: break-word;
        }
        .message-sent {
            align-self: flex-end;
            background: var(--accent-primary);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message-received {
            align-self: flex-start;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 4px;
        }
        .message-system {
            align-self: center;
            background: rgba(99, 102, 241, 0.08);
            color: var(--text-secondary);
            border: 1px solid rgba(99, 102, 241, 0.15);
            text-align: center;
            max-width: 85%;
            font-size: 0.82rem;
        }
        .message-verification {
            align-self: center;
            background: rgba(245, 158, 11, 0.08);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.2);
            text-align: center;
            max-width: 85%;
            font-size: 0.85rem;
        }
        .message-verification .verification-icon {
            display: inline-block;
            margin-bottom: 4px;
        }
        .message-time {
            font-size: 0.65rem;
            margin-top: 4px;
            text-align: right;
        }
        .message-sent .message-time { color: rgba(255,255,255,0.5); }
        .message-received .message-time { color: var(--text-muted); }
        .message-system .message-time { color: var(--text-muted); }

        .chat-empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            padding: 40px;
            text-align: center;
        }
        .chat-empty-icon { font-size: 3rem; margin-bottom: 16px; opacity: 0.4; }
        .chat-empty-title { font-size: 1.1rem; color: var(--text-secondary); margin-bottom: 8px; }
        .chat-empty-desc { font-size: 0.85rem; }

        .chat-input-area {
            padding: 14px 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            background: var(--bg-secondary);
            align-items: flex-end;
            flex-shrink: 0;
        }
        .chat-input {
            flex: 1;
            padding: 10px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-full);
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
            resize: none;
            max-height: 100px;
            line-height: 1.4;
            transition: border-color var(--transition-fast);
        }
        .chat-input:focus { border-color: var(--accent-primary); }
        .chat-send-btn {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-full);
            background: var(--accent-gradient);
            border: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform var(--transition-fast), opacity var(--transition-fast);
            flex-shrink: 0;
        }
        .chat-send-btn:hover { transform: scale(1.05); }
        .chat-send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .typing-indicator-msg {
            align-self: flex-start;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            border-bottom-left-radius: 4px;
            padding: 10px 14px;
            display: none;
        }
        .typing-indicator-msg.visible { display: flex; }

        .date-separator {
            align-self: center;
            font-size: 0.7rem;
            color: var(--text-muted);
            background: var(--bg-primary);
            padding: 4px 12px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-color);
            margin: 8px 0;
        }

        @media (max-width: 1024px) {
            .chat-sidebar { display: none; width: 100%; }
            .chat-sidebar.active { display: flex; position: fixed; inset: 0; top: var(--header-height); z-index: 90; width: 100%; }
            .chat-main { display: flex; }
            .chat-main.hidden { display: none; }
            .chat-back-btn { display: flex; }
            .chat-layout { position: relative; }
        }
        @media (max-width: 640px) {
            .chat-messages { padding: 12px; }
            .message { max-width: 85%; }
            .chat-input-area { padding: 10px 12px; }
        }
    </style>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="/dashboard.html" class="sidebar-logo">
                    <span class="sidebar-logo-icon">🎒</span>
                    <div>
                        <div>Lost & Found</div>
                        <div class="sidebar-subtitle">AVCOE Campus</div>
                    </div>
                </a>
            </div>
            <nav class="sidebar-nav"></nav>
            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="avatar"></div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name"></div>
                        <div class="sidebar-user-role"></div>
                    </div>
                    <button class="btn btn-ghost btn-sm" onclick="auth.logout()" title="Logout" style="padding:6px;">⏻</button>
                </div>
            </div>
        </aside>

        <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

        <main class="main-content">
            <header class="top-bar">
                <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
                <div class="top-bar-title">Messages</div>
                <div class="top-bar-spacer"></div>
                <div class="top-bar-actions">
                    <a href="/notifications.html" class="notification-btn" title="Notifications">🔔<span class="notification-badge" style="display:none;">0</span></a>
                </div>
            </header>

            <div class="chat-layout">
                <div class="chat-sidebar" id="chatSidebar">
                    <div class="chat-sidebar-header">
                        <h3>💬 Chats</h3>
                    </div>
                    <input type="text" class="chat-search" id="chatSearch" placeholder="Search conversations..." oninput="filterConversations()">
                    <div class="chat-list" id="chatList">
                        <div class="skeleton" style="height:60px;margin:8px 12px;"></div>
                        <div class="skeleton" style="height:60px;margin:8px 12px;"></div>
                        <div class="skeleton" style="height:60px;margin:8px 12px;"></div>
                    </div>
                    <div id="noConversations" class="empty-state" style="display:none;padding:40px 20px;">
                        <div class="empty-state-icon">📭</div>
                        <div class="empty-state-title">No conversations yet</div>
                        <div class="empty-state-desc">Claim an item to start a conversation.</div>
                    </div>
                </div>

                <div class="chat-main" id="chatMain">
                    <div class="chat-empty" id="chatEmpty">
                        <div class="chat-empty-icon">💬</div>
                        <div class="chat-empty-title">Select a conversation to start chatting</div>
                        <div class="chat-empty-desc">Choose a conversation from the left panel</div>
                    </div>

                    <div id="chatActiveView" style="display:none;flex-direction:column;height:100%;">
                        <div class="chat-header">
                            <button class="chat-back-btn" id="chatBackBtn" onclick="showChatList()">←</button>
                            <div class="avatar avatar-sm" id="chatHeaderAvatar"></div>
                            <div class="chat-header-info">
                                <div class="chat-header-name" id="chatHeaderName">-</div>
                                <div class="chat-header-item" id="chatHeaderItem">-</div>
                            </div>
                        </div>

                        <div class="chat-messages" id="chatMessages"></div>

                        <div class="typing-indicator-msg" id="typingIndicator">
                            <div class="typing-indicator"><span></span><span></span><span></span></div>
                        </div>

                        <div class="chat-input-area">
                            <input type="text" class="chat-input" id="chatInput" placeholder="Type a message..." onkeydown="handleInputKeydown(event)" autocomplete="off">
                            <button class="chat-send-btn" id="sendBtn" onclick="sendMessage()" title="Send">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <nav class="mobile-nav"><div class="mobile-nav-items"></div></nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script>
        if (!auth.requireAuth()) throw new Error('Not authenticated');
        initSidebar();
        initMobileNav();

        const currentUser = auth.getUser();
        let conversations = [];
        let activeConversationId = null;
        let stompClient = null;
        let currentSubscription = null;
        let allMessages = [];

        async function loadConversations() {
            const chatList = document.getElementById('chatList');
            const noConversations = document.getElementById('noConversations');

            try {
                conversations = await api.getConversations();
                if (!Array.isArray(conversations)) conversations = [];

                if (conversations.length === 0) {
                    chatList.innerHTML = '';
                    noConversations.style.display = 'block';
                    return;
                }

                noConversations.style.display = 'none';
                renderConversations(conversations);
            } catch (err) {
                console.error('Error loading conversations:', err);
                chatList.innerHTML = '<div class="empty-state" style="padding:40px 20px;"><div class="empty-state-title">Failed to load conversations</div></div>';
            }
        }

        function renderConversations(list) {
            const chatList = document.getElementById('chatList');
            if (list.length === 0) {
                chatList.innerHTML = '<div style="padding:40px 20px;text-align:center;color:var(--text-muted);">No matching conversations</div>';
                return;
            }

            chatList.innerHTML = list.map(conv => {
                const otherName = conv.otherUserName || 'Unknown';
                const initials = auth.getInitials(otherName);
                const color = auth.getAvatarColor(otherName);
                const isActive = conv.id === activeConversationId;
                const lastMsg = conv.lastMessage || '';
                const lastTime = conv.lastMessageTime ? formatDate(conv.lastMessageTime) : '';
                const itemName = conv.itemName || '';
                const hasUnread = conv.unreadCount > 0;

                return `
                    <div class="chat-list-item ${isActive ? 'active' : ''}" onclick="openConversation(${conv.id})">
                        <div class="avatar avatar-sm" style="background:${color};">${initials}</div>
                        <div class="chat-list-info">
                            <div class="chat-list-top">
                                <div class="chat-list-name">${escapeHtml(otherName)}</div>
                                <div class="chat-list-time">${lastTime}</div>
                            </div>
                            ${itemName ? `<div class="chat-list-item-name">📦 ${escapeHtml(itemName)}</div>` : ''}
                            <div class="chat-list-preview">${escapeHtml(lastMsg)}</div>
                        </div>
                        ${hasUnread ? '<div class="unread-dot"></div>' : ''}
                    </div>
                `;
            }).join('');
        }

        function filterConversations() {
            const query = document.getElementById('chatSearch').value.toLowerCase().trim();
            if (!query) {
                renderConversations(conversations);
                return;
            }
            const filtered = conversations.filter(c =>
                (c.otherUserName || '').toLowerCase().includes(query) ||
                (c.itemName || '').toLowerCase().includes(query) ||
                (c.lastMessage || '').toLowerCase().includes(query)
            );
            renderConversations(filtered);
        }

        async function openConversation(conversationId) {
            activeConversationId = conversationId;
            const conv = conversations.find(c => c.id === conversationId);
            if (!conv) return;

            document.getElementById('chatEmpty').style.display = 'none';
            document.getElementById('chatActiveView').style.display = 'flex';
            document.getElementById('chatMain').classList.remove('hidden');
            document.getElementById('chatSidebar').classList.remove('active');

            const otherName = conv.otherUserName || 'Unknown';
            const color = auth.getAvatarColor(otherName);
            const initials = auth.getInitials(otherName);

            const headerAvatar = document.getElementById('chatHeaderAvatar');
            headerAvatar.textContent = initials;
            headerAvatar.style.background = color;
            document.getElementById('chatHeaderName').textContent = otherName;
            document.getElementById('chatHeaderItem').textContent = conv.itemName ? `📦 ${conv.itemName}` : '';

            document.querySelectorAll('.chat-list-item').forEach(el => el.classList.remove('active'));
            const activeItem = document.querySelector(`.chat-list-item[onclick="openConversation(${conversationId})"]`);
            if (activeItem) activeItem.classList.add('active');

            document.getElementById('chatMessages').innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);"><div class="spinner spinner-lg"></div></div>';

            try {
                const data = await api.getMessages(conversationId);
                allMessages = Array.isArray(data) ? data : (data.content || []);
                renderMessages();
                markAsRead(conversationId);
                scrollToBottom();
            } catch (err) {
                console.error('Error loading messages:', err);
                document.getElementById('chatMessages').innerHTML = '<div style="text-align:center;padding:20px;color:var(--danger);">Failed to load messages</div>';
            }

            subscribeToConversation(conversationId);
        }

        function renderMessages() {
            const container = document.getElementById('chatMessages');
            if (allMessages.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);">No messages yet. Say hello!</div>';
                return;
            }

            let html = '';
            let lastDate = '';

            allMessages.forEach(msg => {
                const msgDate = new Date(msg.createdAt).toLocaleDateString('en-IN');
                if (msgDate !== lastDate) {
                    html += `<div class="date-separator">${formatDateLabel(msg.createdAt)}</div>`;
                    lastDate = msgDate;
                }
                html += renderMessage(msg);
            });

            html += `
                <div class="message message-received" id="typingBubble" style="display:none;">
                    <div class="typing-indicator"><span></span><span></span><span></span></div>
                </div>
            `;

            container.innerHTML = html;
        }

        function renderMessage(msg) {
            const isSent = msg.senderId === currentUser.id;
            const isSystem = msg.messageType === 'SYSTEM';
            const isVerification = msg.messageType === 'VERIFICATION_QUESTION';

            if (isSystem) {
                return `
                    <div class="message message-system">
                        <div>${escapeHtml(msg.content)}</div>
                        <div class="message-time">${formatTime(msg.createdAt)}</div>
                    </div>
                `;
            }

            if (isVerification) {
                return `
                    <div class="message message-verification">
                        <div class="verification-icon">🔒</div>
                        <div style="font-weight:500;margin-bottom:4px;">Verification Question</div>
                        <div>${escapeHtml(msg.content)}</div>
                        <div class="message-time">${formatTime(msg.createdAt)}</div>
                    </div>
                `;
            }

            const bubbleClass = isSent ? 'message-sent' : 'message-received';
            return `
                <div class="message ${bubbleClass}">
                    <div>${escapeHtml(msg.content)}</div>
                    <div class="message-time">${formatTime(msg.createdAt)}</div>
                </div>
            `;
        }

        function formatDateLabel(dateStr) {
            const date = new Date(dateStr);
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const msgDay = new Date(date.getFullYear(), date.getMonth(), date.getDate());

            if (msgDay.getTime() === today.getTime()) return 'Today';
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            if (msgDay.getTime() === yesterday.getTime()) return 'Yesterday';
            return date.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        function scrollToBottom() {
            const container = document.getElementById('chatMessages');
            requestAnimationFrame(() => {
                container.scrollTop = container.scrollHeight;
            });
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const content = input.value.trim();
            if (!content || !activeConversationId) return;

            input.value = '';
            input.style.height = 'auto';
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;

            const tempMsg = {
                id: Date.now(),
                senderId: currentUser.id,
                content: content,
                messageType: 'TEXT',
                createdAt: new Date().toISOString()
            };
            allMessages.push(tempMsg);
            renderMessages();
            scrollToBottom();

            try {
                const sent = await api.sendMessage(activeConversationId, { content, messageType: 'TEXT' });
                if (sent) {
                    allMessages[allMessages.length - 1] = sent;
                    renderMessages();
                    scrollToBottom();
                }
                updateConversationPreview(activeConversationId, content);
            } catch (err) {
                console.error('Error sending message:', err);
                showToast('Failed to send message', 'error');
            } finally {
                sendBtn.disabled = false;
                input.focus();
            }
        }

        function updateConversationPreview(convId, content) {
            const conv = conversations.find(c => c.id === convId);
            if (conv) {
                conv.lastMessage = content;
                conv.lastMessageTime = new Date().toISOString();
                renderConversations(document.getElementById('chatSearch').value.trim()
                    ? conversations.filter(c =>
                        (c.otherUserName || '').toLowerCase().includes(document.getElementById('chatSearch').value.toLowerCase()) ||
                        (c.itemName || '').toLowerCase().includes(document.getElementById('chatSearch').value.toLowerCase())
                    )
                    : conversations
                );
            }
        }

        function handleInputKeydown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        async function markAsRead(conversationId) {
            try {
                const conv = conversations.find(c => c.id === conversationId);
                if (conv) {
                    conv.unreadCount = 0;
                    renderConversations(document.getElementById('chatSearch').value.trim()
                        ? conversations.filter(c =>
                            (c.otherUserName || '').toLowerCase().includes(document.getElementById('chatSearch').value.toLowerCase()) ||
                            (c.itemName || '').toLowerCase().includes(document.getElementById('chatSearch').value.toLowerCase())
                        )
                        : conversations
                    );
                }
            } catch { /* ignore */ }
        }

        function showChatList() {
            document.getElementById('chatSidebar').classList.add('active');
            document.getElementById('chatMain').classList.add('hidden');
        }

        function showChat() {
            document.getElementById('chatSidebar').classList.remove('active');
            document.getElementById('chatMain').classList.remove('hidden');
        }

        // WebSocket
        function connectWebSocket() {
            const socket = new SockJS('/ws');
            stompClient = Stomp.over(socket);
            stompClient.debug = null;

            stompClient.connect({ Authorization: `Bearer ${auth.getToken()}` }, function() {
                stompClient.subscribe('/user/queue/messages', function(message) {
                    const msg = JSON.parse(message.body);
                    handleIncomingMessage(msg);
                });
            }, function(err) {
                console.error('WebSocket error:', err);
                setTimeout(connectWebSocket, 5000);
            });
        }

        function subscribeToConversation(conversationId) {
            if (currentSubscription) {
                try { currentSubscription.unsubscribe(); } catch {}
            }
            if (stompClient && stompClient.connected) {
                currentSubscription = stompClient.subscribe(`/topic/conversation/${conversationId}`, function(message) {
                    const msg = JSON.parse(message.body);
                    handleIncomingMessage(msg);
                });
            }
        }

        function handleIncomingMessage(msg) {
            if (msg.conversationId === activeConversationId) {
                const exists = allMessages.find(m => m.id === msg.id);
                if (!exists) {
                    allMessages.push(msg);
                    renderMessages();
                    scrollToBottom();
                    markAsRead(activeConversationId);
                }
            }

            const conv = conversations.find(c => c.id === msg.conversationId);
            if (conv) {
                conv.lastMessage = msg.content;
                conv.lastMessageTime = msg.createdAt;
                if (msg.conversationId !== activeConversationId || document.hidden) {
                    conv.unreadCount = (conv.unreadCount || 0) + 1;
                }
                renderConversations(document.getElementById('chatSearch').value.trim()
                    ? conversations.filter(c =>
                        (c.otherUserName || '').toLowerCase().includes(document.getElementById('chatSearch').value.toLowerCase()) ||
                        (c.itemName || '').toLowerCase().includes(document.getElementById('chatSearch').value.toLowerCase())
                    )
                    : conversations
                );
            }
        }

        // Auto-resize input
        document.getElementById('chatInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        });

        // Mobile responsiveness
        function handleResize() {
            const sidebar = document.getElementById('chatSidebar');
            const main = document.getElementById('chatMain');
            if (window.innerWidth > 1024) {
                sidebar.classList.remove('active');
                main.classList.remove('hidden');
            } else if (!activeConversationId) {
                sidebar.classList.add('active');
                main.classList.add('hidden');
            }
        }
        window.addEventListener('resize', handleResize);

        // Init
        loadConversations();
        connectWebSocket();
        handleResize();
        setInterval(loadUnreadCount, 30000);
    </script>
</body>
</html>
