<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Found Items — AVCOE Lost & Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="/dashboard.html" class="sidebar-logo">
                    <span class="sidebar-logo-icon">🎒</span>
                    <div>
                        <div>Lost &amp; Found</div>
                        <div class="sidebar-subtitle">AVCOE Campus</div>
                    </div>
                </a>
            </div>
            <nav class="sidebar-nav"></nav>
            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="avatar"></div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name"></div>
                        <div class="sidebar-user-role"></div>
                    </div>
                    <button class="btn btn-ghost btn-sm" onclick="auth.logout()" title="Logout" aria-label="Logout">⏻</button>
                </div>
            </div>
        </aside>

        <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

        <main class="main-content">
            <header class="top-bar">
                <button class="mobile-menu-btn" onclick="toggleSidebar()" aria-label="Open navigation">☰</button>
                <div class="top-bar-title">Found Items</div>
                <div class="top-bar-spacer"></div>
                <div class="top-bar-actions">
                    <a href="/notifications.html" class="notification-btn" title="Notifications" aria-label="Notifications">🔔<span class="notification-badge" style="display:none;">0</span></a>
                </div>
            </header>

            <div class="page-content">
                <div class="animate-fade-in-up" style="margin-bottom:24px;">
                    <h1 style="margin-bottom:8px;">📦 Found Items</h1>
                    <p style="color:var(--text-muted);">Browse items found on campus and find your belongings.</p>
                </div>

                <div class="search-bar">
                    <input type="search" id="searchInput" class="form-input" placeholder="Search found items..." aria-label="Search found items" style="flex:1;min-width:0;">
                    <select id="locationFilter" class="form-select" aria-label="Filter by location" style="max-width:220px;">
                        <option value="">All Locations</option>
                    </select>
                    <button class="btn btn-primary" id="searchBtn">Search</button>
                </div>

                <div class="filter-group" id="filterChips" aria-label="Filter by category">
                    <button class="filter-chip active" data-category="">All</button>
                    <button class="filter-chip" data-category="ELECTRONICS">📱 Electronics</button>
                    <button class="filter-chip" data-category="BAGS">🎒 Bags</button>
                    <button class="filter-chip" data-category="BOOKS">📚 Books</button>
                    <button class="filter-chip" data-category="ID_CARDS">🪪 ID Cards</button>
                    <button class="filter-chip" data-category="WALLETS">👛 Wallets</button>
                    <button class="filter-chip" data-category="KEYS">🔑 Keys</button>
                    <button class="filter-chip" data-category="DOCUMENTS">📄 Documents</button>
                    <button class="filter-chip" data-category="CLOTHING">👕 Clothing</button>
                    <button class="filter-chip" data-category="ACCESSORIES">⌚ Accessories</button>
                    <button class="filter-chip" data-category="STATIONERY">✏️ Stationery</button>
                    <button class="filter-chip" data-category="OTHER">📦 Other</button>
                </div>

                <div class="items-grid" id="itemsGrid" aria-live="polite">
                    <div class="skeleton" style="height:300px;"></div>
                    <div class="skeleton" style="height:300px;"></div>
                    <div class="skeleton" style="height:300px;"></div>
                </div>

                <div id="emptyState" class="empty-state" style="display:none;">
                    <div class="empty-state-icon">📭</div>
                    <div class="empty-state-title">No found items match your search</div>
                    <div class="empty-state-desc">Try adjusting your search or filters.</div>
                </div>

                <div id="pagination" class="pagination" style="display:none;margin-top:28px;justify-content:center;gap:8px;"></div>
            </div>
        </main>

        <nav class="mobile-nav"><div class="mobile-nav-items"></div></nav>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script>
        if (!auth.requireAuth()) throw new Error('Not authenticated');
        initSidebar();
        initMobileNav();

        let currentPage = 0;
        let currentCategory = '';
        const pageSize = 12;
        const searchInput = document.getElementById('searchInput');
        const locationFilter = document.getElementById('locationFilter');
        const itemsGrid = document.getElementById('itemsGrid');
        const emptyState = document.getElementById('emptyState');
        const pagination = document.getElementById('pagination');

        async function loadLocations() {
            try {
                const locations = await api.getLocations();
                locations.forEach(location => {
                    const option = document.createElement('option');
                    option.value = location.name;
                    option.textContent = location.name;
                    locationFilter.appendChild(option);
                });
            } catch (error) {
                console.error('Failed to load locations:', error);
                showToast('Could not load campus locations.', 'error');
            }
        }

        async function loadItems(page = 0) {
            currentPage = page;
            itemsGrid.style.display = '';
            itemsGrid.innerHTML = '<div class="skeleton" style="height:300px;"></div>'.repeat(3);
            emptyState.style.display = 'none';
            pagination.style.display = 'none';

            const params = { type: 'FOUND', page: currentPage, size: pageSize };
            const search = searchInput.value.trim();
            const location = locationFilter.value;
            if (search) params.search = search;
            if (currentCategory) params.category = currentCategory;
            if (location) params.location = location;

            try {
                const data = await api.getItems(params);
                const items = data.content || [];
                if (items.length === 0) {
                    itemsGrid.style.display = 'none';
                    emptyState.style.display = 'block';
                    return;
                }

                itemsGrid.innerHTML = items.map(item => `
                    <a href="/item.html?id=${item.id}" class="item-card hover-lift" style="text-decoration:none;color:inherit;">
                        <div class="item-card-image">
                            ${item.images && item.images.length
                                ? `<img src="${item.images[0].imageUrl}" alt="${escapeHtml(item.itemName)}">`
                                : `<span>${getCategoryIcon(item.category)}</span>`}
                        </div>
                        <div class="item-card-body">
                            <div class="item-card-header">
                                <div class="item-card-title">${escapeHtml(item.itemName)}</div>
                                <span class="badge badge-found">FOUND</span>
                            </div>
                            <div class="item-card-desc">${escapeHtml(item.description || '')}</div>
                            <div class="item-card-meta">
                                <span>📍 ${escapeHtml(item.locationName || 'Campus')}</span>
                                <span>🕐 ${formatDate(item.dateOfEvent || item.createdAt)}</span>
                            </div>
                        </div>
                    </a>
                `).join('');
                renderPagination(data.totalPages || 0);
            } catch (error) {
                console.error('Failed to load found items:', error);
                itemsGrid.style.display = 'none';
                emptyState.style.display = 'block';
                emptyState.querySelector('.empty-state-title').textContent = 'Could not load found items';
                emptyState.querySelector('.empty-state-desc').textContent = 'Please check your connection and try again.';
            }
        }

        function renderPagination(totalPages) {
            if (totalPages <= 1) return;
            pagination.style.display = 'flex';
            pagination.innerHTML = `
                <button class="btn btn-secondary btn-sm" ${currentPage === 0 ? 'disabled' : ''} data-page="${currentPage - 1}">‹ Prev</button>
                <span class="btn btn-ghost btn-sm" aria-current="page">Page ${currentPage + 1} of ${totalPages}</span>
                <button class="btn btn-secondary btn-sm" ${currentPage >= totalPages - 1 ? 'disabled' : ''} data-page="${currentPage + 1}">Next ›</button>
            `;
            pagination.querySelectorAll('button[data-page]').forEach(button => {
                button.addEventListener('click', () => loadItems(Number(button.dataset.page)));
            });
        }

        document.getElementById('searchBtn').addEventListener('click', () => loadItems(0));
        searchInput.addEventListener('keydown', event => {
            if (event.key === 'Enter') loadItems(0);
        });
        locationFilter.addEventListener('change', () => loadItems(0));
        document.getElementById('filterChips').addEventListener('click', event => {
            const chip = event.target.closest('[data-category]');
            if (!chip) return;
            currentCategory = chip.dataset.category;
            document.querySelectorAll('#filterChips .filter-chip').forEach(button => {
                button.classList.toggle('active', button === chip);
            });
            loadItems(0);
        });

        loadLocations();
        loadItems();
        setInterval(loadUnreadCount, 30000);
    </script>
</body>
</html>
