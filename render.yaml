services:
  - type: web
    name: avcoe-lostfound
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: SPRING_H2_CONSOLE_ENABLED
        value: "false"
      - key: APP_SEED_DEMO_DATA
        value: "false"
      - key: APP_INITIAL_ADMIN_EMAIL
        sync: false
      - key: APP_INITIAL_ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: LOGGING_LEVEL_COM_AVCOE_LOSTFOUND
        value: INFO
