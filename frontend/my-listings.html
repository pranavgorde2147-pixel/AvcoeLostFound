<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Listings — AVCOE Lost &amp; Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="/dashboard.html" class="sidebar-logo">
                    <span class="sidebar-logo-icon">🎒</span>
                    <div><div>Lost &amp; Found</div><div class="sidebar-subtitle">AVCOE Campus</div></div>
                </a>
            </div>
            <nav class="sidebar-nav"></nav>
            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="avatar"></div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name"></div>
                        <div class="sidebar-user-role"></div>
                    </div>
                    <button class="btn btn-ghost btn-sm" onclick="auth.logout()" title="Logout" aria-label="Logout">⏻</button>
                </div>
            </div>
        </aside>
        <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
        <main class="main-content">
            <header class="top-bar">
                <button class="mobile-menu-btn" onclick="toggleSidebar()" aria-label="Open navigation">☰</button>
                <div class="top-bar-title">My Listings</div>
                <div class="top-bar-spacer"></div>
                <div class="top-bar-actions">
                    <a href="/notifications.html" class="notification-btn" title="Notifications" aria-label="Notifications">🔔<span class="notification-badge" style="display:none;">0</span></a>
                </div>
            </header>
            <div class="page-content">
                <div class="animate-fade-in-up" style="margin-bottom:24px;">
                    <h1 style="margin-bottom:8px;">📋 My Listings</h1>
                    <p style="color:var(--text-muted);">Manage your reports. Unlisting hides an item from other people without deleting it.</p>
                </div>
                <div class="items-grid" id="listingsGrid" aria-live="polite">
                    <div class="skeleton" style="height:300px;"></div>
                    <div class="skeleton" style="height:300px;"></div>
                </div>
                <div id="emptyState" class="empty-state" style="display:none;">
                    <div class="empty-state-icon">📭</div>
                    <div class="empty-state-title">You have no listings yet</div>
                    <div class="empty-state-desc">Create a lost or found item report to see it here.</div>
                </div>
            </div>
        </main>
        <nav class="mobile-nav"><div class="mobile-nav-items"></div></nav>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script>
        if (!auth.requireAuth()) throw new Error('Not authenticated');
        initSidebar();
        initMobileNav();

        const listingsGrid = document.getElementById('listingsGrid');
        const emptyState = document.getElementById('emptyState');

        async function loadListings() {
            try {
                const listings = await api.getMyItems();
                if (!listings.length) {
                    listingsGrid.style.display = 'none';
                    emptyState.style.display = 'block';
                    return;
                }

                listingsGrid.innerHTML = listings.map(item => `
                    <div class="item-card">
                        <a href="/item.html?id=${item.id}" style="text-decoration:none;color:inherit;">
                            <div class="item-card-image">
                                ${item.images && item.images.length
                                    ? `<img src="${item.images[0].imageUrl}" alt="${escapeHtml(item.itemName)}">`
                                    : `<span>${getCategoryIcon(item.category)}</span>`}
                            </div>
                        </a>
                        <div class="item-card-body">
                            <div class="item-card-header">
                                <div class="item-card-title">${escapeHtml(item.itemName)}</div>
                                <span class="badge badge-${item.itemType === 'LOST' ? 'lost' : 'found'}">${item.itemType}</span>
                            </div>
                            <div class="item-card-desc">${escapeHtml(item.description || '')}</div>
                            <div class="item-card-meta">
                                <span>${getStatusBadge(item.status)}</span>
                                <span>${item.listed && item.status === 'ACTIVE' ? 'Visible in listings' : 'Unlisted'}</span>
                            </div>
                            ${item.status === 'ACTIVE' || item.status === 'OWNER_VERIFIED' ? `
                                <button class="btn ${item.listed ? 'btn-secondary' : 'btn-primary'}" style="width:100%;margin-top:12px;"
                                    onclick="toggleListing(${item.id}, ${!(item.listed && item.status === 'ACTIVE')})">
                                        ${item.listed && item.status === 'ACTIVE' ? 'Unlist item' : 'List item'}
                                </button>` : ''}
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Failed to load listings:', error);
                listingsGrid.innerHTML = '<div class="empty-state"><div class="empty-state-title">Could not load your listings</div><div class="empty-state-desc">Please try again.</div></div>';
            }
        }

        async function toggleListing(itemId, listed) {
            try {
                await api.updateItemListing(itemId, listed);
                showToast(listed ? 'Item listed.' : 'Item unlisted.', 'success');
                await loadListings();
            } catch (error) {
                showToast(error.message || 'Could not update this listing.', 'error');
            }
        }

        loadListings();
    </script>
</body>
</html>
